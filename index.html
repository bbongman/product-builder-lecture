<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개인 사주 사이트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>당신의 사주를 알려드립니다</h1>
        <p>생년월일을 입력하시면 오늘의 운세를 알려드립니다.</p>
        <div class="input-group">
            <input type="number" id="year" placeholder="년 (YYYY)" min="1900" max="2024">
            <input type="number" id="month" placeholder="월" min="1" max="12">
            <input type="number" id="day" placeholder="일" min="1" max="31">
        </div>
        <button id="get-fortune">운세 보기</button>
        <div id="fortune-result-container"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
