<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Motivation - 당신의 하루를 응원합니다</title>
    <meta name="google-adsense-account" content="ca-pub-9754167781174678">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9754167781174678"
     crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&family=Nanum+Myeongjo:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-overlay"></div>
    <main class="container">
        <header>
            <h1>오늘의 동기부여</h1>
            <p class="subtitle">매 순간 당신의 도전을 응원합니다</p>
        </header>
        
        <section class="quote-card">
            <div id="quote-container">
                <blockquote id="quote">"포기하지 마세요. 시작은 언제나 힘든 법입니다."</blockquote>
                <cite id="author">- 익명</cite>
            </div>
            <div class="actions">
                <button id="new-quote-btn">새로운 영감 얻기</button>
            </div>
        </section>

        <section class="form-container">
            <div class="form-card">
                <h2>제휴 및 협업 문의</h2>
                <p class="form-desc">함께 성장해나갈 파트너를 기다립니다. 아래 양식을 작성해 주세요.</p>
                
                <form action="https://formspree.io/f/xojnokkp" method="POST" id="partnership-form">
                    <div class="form-group">
                        <label for="name">성함/기업명</label>
                        <input type="text" id="name" name="name" placeholder="성함 또는 기업명을 입력해주세요" required>
                    </div>
                    <div class="form-group">
                        <label for="email">이메일 주소</label>
                        <input type="email" id="email" name="_replyto" placeholder="연락받으실 이메일을 입력해주세요" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">문의 주제</label>
                        <select id="subject" name="subject" required>
                            <option value="" disabled selected>주제를 선택해주세요</option>
                            <option value="content_partnership">콘텐츠 제휴</option>
                            <option value="ad_inquiry">광고 문의</option>
                            <option value="tech_collaboration">기술 협업</option>
                            <option value="others">기타</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message">문의 내용</label>
                        <textarea id="message" name="message" rows="5" placeholder="상세한 문의 내용을 적어주세요" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">문의하기</button>
                </form>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 Daily Motivation. All rights reserved.</p>
        </footer>
    </main>
    <script src="main.js"></script>
</body>
</html>
